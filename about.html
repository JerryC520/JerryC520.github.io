  <script>
  const savedTheme = localStorage.getItem('theme');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
  if (savedTheme === 'dark' || (savedTheme !== 'light' && systemDark.matches)) {
    document.body.classList.add('dark');
  } else {
    document.body.classList.remove('dark');
  }
  systemDark.addEventListener('change', (e) => {
    if (!localStorage.getItem('theme')) {
      document.body.classList.toggle('dark', e.matches);
    }
  });
  const toggleBtn = document.getElementById('theme-toggle');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      if (document.body.classList.contains('dark')) {
        localStorage.setItem('theme', 'dark');
      } else {
        localStorage.setItem('theme', 'light');
      }
    });
  }
</script>


<script>
  function applyLang(lang) {
    document.body.classList.toggle('zh', lang === 'zh');
    document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-Hant' : 'en');
    document.querySelectorAll('[data-setlang]').forEach((el) => {
      el.classList.toggle('lang-active', el.getAttribute('data-setlang') === lang);
    });
  }
  applyLang(localStorage.getItem('lang') === 'zh' ? 'zh' : 'en');
  document.querySelectorAll('[data-setlang]').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const lang = el.getAttribute('data-setlang');
      localStorage.setItem('lang', lang);
      applyLang(lang);
    });
  });
</script>
